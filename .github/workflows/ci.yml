name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  # Golden facts on pinned Redis and SQLite (tests/realrepo). Slow-ish (~1 min), but it runs on every PR.
  realrepo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked
      # The pinned archives never change, so the cache key is the file that pins them.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/aerotrace-realrepo
          key: realrepo-${{ hashFiles('tests/realrepo/repos.py') }}
      - name: Download and check the pinned sources (SHA-256)
        run: uv run python tests/realrepo/repos.py
      - name: Golden facts
        run: uv run pytest -m realrepo -rxX

  # The dashboard and the HTML reports in a real browser: pages, labels, keyboard, layout and colour
  # snapshots in light and dark (tests/golden/ui/dashboard-*.json). Linux only.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Headless Chromium for Playwright
        run: uv run --with playwright playwright install --with-deps chromium
      - name: Browser tests
        run: uv run --with playwright pytest -m browser -rxX

  # One stable check name for branch protection (matrix job names change).
  ci-ok:
    if: always()
    needs: [lint, test, realrepo, browser]
    runs-on: ubuntu-latest
    steps:
      - run: >-
          test "${{ needs.lint.result }}" = success &&
          test "${{ needs.test.result }}" = success &&
          test "${{ needs.realrepo.result }}" = success &&
          test "${{ needs.browser.result }}" = success
