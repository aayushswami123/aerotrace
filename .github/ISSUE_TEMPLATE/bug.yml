name: Bug
description: Something is broken (install, crash, slow, wrong message).
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected, and what you saw.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Output of `aerotrace doctor`
      render: text
    validations:
      required: true
