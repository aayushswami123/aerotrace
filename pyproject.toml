[project]
name = "aerotrace"
version = "0.1.0.dev0"
description = "Safety layer for AI coding agents on critical legacy C/C++ code: local, deterministic change impact."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aayush Swami" }]
requires-python = ">=3.11"
dependencies = [
    "libclang>=18.1.1",
    "mcp>=2.3,<3",
]

[project.scripts]
aerotrace = "aerotrace.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pre-commit>=4",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerotrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not realrepo and not browser and not e2e' --strict-markers"
markers = [
    "e2e: a real headless Claude Code session (costs money; run with -m e2e)",
    "realrepo: slow tests on real open-source repos (run with -m realrepo)",
    "browser: the HTML report in a headless browser (run with: uv run --with playwright pytest -m browser)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # ruff format owns line length; long SQL and messages are fine

[tool.ruff.lint.per-file-ignores]
"bench/judge/*" = ["UP031"]  # copied word for word from docs/benchmark/protocol.md
